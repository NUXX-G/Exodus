# Despliegue (local o VPS), desde la raíz del repositorio:
#   ./deploy.sh            (Linux / macOS)
#   deploy.bat             (Windows)
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Acceso:
#   - Local o por túnel SSH (por defecto): el puerto se publica solo en 127.0.0.1.
#       ssh -L 3210:127.0.0.1:3210 usuario@vps
#   - VPS con dominio y HTTPS automático: perfil `https` (ver docker/Caddyfile).
#       EXODUS_DOMAIN=exodus.midominio.com ./deploy.sh
# La primera visita crea la cuenta de la instancia en /configurar: hazla nada más desplegar.
# No publiques el puerto con EXODUS_BIND=0.0.0.0: las contraseñas viajarían sin cifrar.

name: exodus

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: exodus-web:latest
    restart: unless-stopped
    # El proceso escribe database/exodus.db en el host: debe correr con el UID del dueño
    # del repositorio. deploy.sh exporta EXODUS_UID/EXODUS_GID automáticamente.
    user: "${EXODUS_UID:-1000}:${EXODUS_GID:-1000}"
    ports:
      - "${EXODUS_BIND:-127.0.0.1}:${EXODUS_PORT:-3210}:3000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # Con el proxy Caddy delante (perfil https) se confía en su X-Forwarded-For.
      EXODUS_TRUST_PROXY: ${EXODUS_TRUST_PROXY:-0}
    volumes:
      # Vault de Obsidian, solo lectura. Se actualiza con `git pull` en el host, sin reconstruir.
      - ../vault:/vault:ro
      # SQLite: el archivo vive en el host como database/exodus.db (cuenta, progreso, flags, actividad).
      - ../database:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Proxy inverso con certificado de Let's Encrypt. Solo arranca con `--profile https`.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      EXODUS_DOMAIN: ${EXODUS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
